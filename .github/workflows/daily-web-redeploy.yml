# Daily redeploy of the Railway `web` service.
#
# WHY: the blog's 145 articles publish on a date drip (articles.json), and the
# prerender step (apps/web/scripts/prerender.mjs) emits static HTML only for
# articles that are live at BUILD time. Without a daily rebuild, an article that
# comes due today has no crawlable HTML until the next code push. This workflow
# redeploys the web service every day just after midnight Asia/Manila, so the
# build re-runs the drip filter and the newest article gets its static page.
#
# SETUP (one-time, owner): create a PROJECT token in Railway (project
# "accurate-insight" → Settings → Tokens) and add it as the repo secret
# RAILWAY_TOKEN. Until the secret exists this workflow fails fast and harmlessly.
name: daily-web-redeploy

on:
  schedule:
    # 16:35 UTC = 00:35 Asia/Manila (UTC+8) — right after the drip day rolls over.
    - cron: "35 16 * * *"
  workflow_dispatch: {} # manual trigger for testing

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy Railway web service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not set — add a Railway project token in repo secrets."
            exit 1
          fi
          npm i -g @railway/cli
          railway redeploy --service web --yes
