<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#160b28" />
    <link rel="icon" href="/assets/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <!-- iOS "Add to Home Screen" (standalone PWA) — iOS Safari reads these, not
         the web manifest. Run fullscreen (no Safari chrome), keep the status bar
         translucent over the dark royal background, and label the icon "Dama". -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dama" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Per-route <head> (title, description, canonical, Open Graph, Twitter, and
         JSON-LD) is owned by react-helmet-async and emitted per page — see
         SiteHead (home default) and the per-route <Helmet> in BlogPage/ArticlePage.
         These tags are intentionally NOT hardcoded here: a static shell <title>/
         canonical/og:url would survive onto every prerendered route alongside
         Helmet's, producing duplicate/conflicting canonicals that can deindex the
         content pages. The shell keeps only globally-true tags (charset, viewport,
         theme-color, icons, apple-*, manifest, analytics). A no-JS <title> fallback
         lives just below so a script-less client still shows a sensible tab label. -->
    <title>FilipinoDama Royal — Play Filipino Dama Online</title>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1566389428206057');
      fbq('track', 'PageView');
    </script>
    <!-- End Meta Pixel Code -->

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-48RNYS7P4C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-48RNYS7P4C');
    </script>
  </head>
  <body>
    <!-- Meta Pixel (noscript fallback) — must live in <body>, not <head> -->
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=1566389428206057&ev=PageView&noscript=1"
        alt=""
      />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
