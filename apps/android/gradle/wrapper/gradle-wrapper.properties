distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
# Pin the distribution by CONTENT, not just by URL. validateDistributionUrl only
# checks the host — it says nothing about the bytes that arrive. A compromised or
# MITM'd download executes arbitrary code on whichever machine runs the build,
# and that machine is the one holding upload-keystore.jks: the highest-value host
# in this project. This is the official published SHA-256 for gradle-8.13-bin.zip;
# a mismatch fails the build loudly instead of silently running unknown code.
distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
