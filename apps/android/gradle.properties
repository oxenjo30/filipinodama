# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled
# with the Android operating system, and which are packaged with the app's
# APK. See: https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself and none from the
# library's dependencies, thereby reducing the size of the R class for
# that library.
android.nonTransitiveRClass=true

# R8 OPTIMIZED RESOURCE SHRINKING — Play Console "Technical quality" advisory on
# the 55 (0.1.55) release: "Optimized resource shrinking isn't enabled".
#
# The legacy shrinker decides what to keep by looking at resources alone.
# Optimized shrinking lets R8 trace references ACROSS the DEX/resource boundary,
# so it removes unreachable resources AND the dex code that only existed to
# reference them. Explicitly opting in is required on AGP 8.6-8.x; from AGP 9.0
# it is simply the default whenever isShrinkResources is on, at which point this
# line becomes redundant and should be deleted with the upgrade.
#
# Preconditions, all already true for this project — do not enable this without
# rechecking them:
#   - isMinifyEnabled = true and isShrinkResources = true (app/build.gradle.kts,
#     both on since versionCode 53, the first minified release)
#   - proguard-android-optimize.txt as the default rules file (REQUIRED; the
#     non-optimize variant is not supported for this mode)
#
# THE RISK, and why it is low here: optimized shrinking is static analysis, so a
# resource reached only DYNAMICALLY — Resources.getIdentifier("ic_" + name) and
# friends — looks unreachable and gets stripped, surfacing as a missing image or
# a crash at runtime rather than a build failure. This codebase contains NO
# getIdentifier() call at all (verified by grep across app/src/main/java), and
# its remote art (StoreAssets/AvatarAssets/RankTiers) is fetched by URL rather
# than resolved out of the resource table, so there is nothing for the analysis
# to miss. If a dynamic lookup is ever introduced, keep it alive explicitly with
# a `tools:keep` entry rather than turning this back off.
android.r8.optimizedResourceShrinking=true
