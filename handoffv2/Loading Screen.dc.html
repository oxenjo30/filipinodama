<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#E8B84B;--gold-lt:#F5D783;--gold-dp:#C99A2E;--ink:#c9b8e0;--ink2:#9a86bd}
*{box-sizing:border-box}
body{margin:0;background:#0c0718;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
@keyframes lsSpin{to{transform:rotate(360deg)}}
@keyframes lsPulse{0%,100%{transform:rotate(45deg) scale(1);filter:brightness(1)}50%{transform:rotate(45deg) scale(1.08);filter:brightness(1.18)}}
@keyframes lsShimmer{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes lsFadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes lsDust{0%{opacity:0;transform:translateY(0) scale(.7)}15%{opacity:1}100%{opacity:0;transform:translateY(-120px) scale(1.1)}}
@keyframes lsGlow{0%,100%{opacity:.6}50%{opacity:1}}
</style>
</helmet>

<div style="position:relative;width:100%;min-height:100vh;overflow:hidden;background:#0c0718;display:flex;flex-direction:column;justify-content:space-between">

  <!-- painted placeholder scene (always behind) -->
  {{ sceneLayer }}
  <!-- Meshy art (null until file exists) -->
  {{ bgImgEl }}

  <!-- scrims -->
  <div style="position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 32%,transparent 40%,rgba(8,4,18,.55) 100%)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,transparent,rgba(8,4,18,.82) 62%,rgba(8,4,18,.96))"></div>
  <div style="position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(232,184,75,.05) 1px,transparent 1px);background-size:30px 30px;pointer-events:none"></div>

  <!-- floating dust -->
  <sc-if value="{{ showDust }}" hint-placeholder-val="{{ true }}">{{ dustLayer }}</sc-if>

  <!-- corner: swap-art hint -->
  <sc-if value="{{ showNote }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;top:16px;left:16px;z-index:5;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;border:1px dashed rgba(232,184,75,.4);background:rgba(15,8,32,.66);font:600 11px 'JetBrains Mono',monospace;color:var(--gold-lt)">
      <span style="width:7px;height:7px;border-radius:50%;background:var(--gold);animation:lsGlow 1.6s ease-in-out infinite"></span>{{ noteText }}
    </div>
  </sc-if>

  <!-- top spacer -->
  <div style="flex:0 0 8vh"></div>

  <!-- center crest + wordmark -->
  <div style="position:relative;z-index:3;text-align:center;padding:0 24px">
    {{ crestEl }}
    <div style="font:800 15px Cinzel,serif;letter-spacing:7px;color:var(--gold-lt);margin-left:7px">FILIPINO</div>
    <div style="font:900 clamp(38px,6vw,58px)/1 Cinzel,serif;letter-spacing:3px;background:linear-gradient(180deg,#f7e2a0,#d5a63a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:2px">DAMA ROYAL</div>
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-top:20px">
      <i style="width:56px;height:1px;background:linear-gradient(90deg,transparent,rgba(232,184,75,.55))"></i>
      <span style="font:700 12px Inter;letter-spacing:3px;text-transform:uppercase;color:var(--gold)">{{ eyebrow }}</span>
      <i style="width:56px;height:1px;background:linear-gradient(90deg,rgba(232,184,75,.55),transparent)"></i>
    </div>
  </div>

  <!-- bottom: tip + progress -->
  <div style="position:relative;z-index:3;padding:0 24px 6vh;display:flex;flex-direction:column;align-items:center;gap:20px">
    <div style="min-height:44px;display:flex;align-items:center;justify-content:center;text-align:center">{{ tipEl }}</div>
    <div style="width:100%;max-width:560px">
      <div style="display:flex;align-items:center;gap:14px">
        {{ spinnerEl }}
        <div style="flex:1">{{ progressBar }}</div>
        <span style="font:700 14px 'JetBrains Mono',monospace;color:var(--gold-lt);min-width:44px;text-align:right">{{ pctText }}</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:760},&quot;context&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;matchmaking&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;matchmaking&quot;,&quot;ranked&quot;,&quot;postwin&quot;,&quot;seasonal&quot;,&quot;obsidian&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Loading screen&quot;},&quot;showDust&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Loading screen&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.25,&quot;unit&quot;:&quot;x&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Loading screen&quot;}}">
class Component extends DCLogic {
  state = { pct: 0, tipIdx: 0, missing: {}, portrait: false };

  tips = [
    "Kapag may kaya kang kunin, kailangan mong kunin — captures are forced.",
    "Protect your back row to stop enemy pieces from crowning.",
    "A dama (king) glides and captures along the entire diagonal.",
    "Bait one piece to win two — set up the double capture.",
    "Control the center. Doon nangyayari ang laban.",
    "Trade pieces when you're ahead — simplify your way to victory.",
    "Patience wins. Wag padalos-dalos sa unang kilos.",
  ];

  ctx(){
    const M = {
      default:    { base:'throne',      eyebrow:'Preparing the court', glow:'rgba(120,70,170,.5)', edge:'rgba(120,30,50,.22)' },
      matchmaking:{ base:'matchmaking', eyebrow:'Finding opponent',    glow:'rgba(120,70,170,.5)', edge:'rgba(47,143,91,.22)' },
      ranked:     { base:'crimson',     eyebrow:'Ranked match',        glow:'rgba(150,50,60,.5)',  edge:'rgba(160,48,58,.3)'  },
      postwin:    { base:'victory',     eyebrow:'Victory hall',        glow:'rgba(160,120,40,.5)', edge:'rgba(232,184,75,.28)'},
      seasonal:   { base:'jade',        eyebrow:'Seasonal event',      glow:'rgba(46,140,110,.5)', edge:'rgba(46,140,110,.28)'},
      obsidian:   { base:'obsidian',    eyebrow:'Obsidian court',      glow:'rgba(60,80,150,.5)',  edge:'rgba(232,184,75,.22)'},
    };
    return M[this.props.context] || M.matchmaking;
  }

  componentDidMount(){
    const spd = () => (this.props.speed || 1);
    this._t0 = Date.now();
    this._tick = setInterval(() => {
      const dur = this.props.duration;
      if (dur) {
        // one-shot fill for the in-game hand-off: 0 → 100, then hold
        this.setState({ pct: Math.min(100, (Date.now() - this._t0) / dur * 100) });
      } else {
        // standalone/preview: gentle looping demo
        this.setState(s => {
          let p = s.pct + (1.6 + Math.random()*4.6) * spd();
          if (p >= 100) p = 0;
          return { pct: p };
        });
      }
    }, 60);
    this._tipTimer = setInterval(() => {
      this.setState(s => ({ tipIdx: (s.tipIdx + 1) % this.tips.length }));
    }, 3800);
    this._onResize = () => { const p = window.innerHeight > window.innerWidth; if (p !== this.state.portrait) this.setState({ portrait: p }); };
    this._onResize();
    window.addEventListener('resize', this._onResize);
  }
  componentWillUnmount(){ clearInterval(this._tick); clearInterval(this._tipTimer); if (this._onResize) window.removeEventListener('resize', this._onResize); }

  renderVals(){
    const el = React.createElement;
    const c = this.ctx();
    const pct = Math.max(0, Math.min(100, this.state.pct));
    const file = 'loading/load-' + c.base + (this.state.portrait ? '-portrait' : '') + '.webp';
    const src = 'uploads/' + file;
    const missing = !!this.state.missing[file];

    // painted placeholder scene — reads as intentional art until Meshy renders land
    const sceneLayer = el('div', { style:{ position:'absolute', inset:0,
      background:'radial-gradient(1000px 620px at 50% 10%, '+c.glow+', transparent 62%),'
               +'radial-gradient(760px 720px at 12% 100%, '+c.edge+', transparent 60%),'
               +'radial-gradient(760px 720px at 88% 100%, '+c.edge+', transparent 60%),'
               +'linear-gradient(180deg,#1c1030 0%,#120a24 46%,#0b0616 100%)' } },
      // faint dama board ghost near the horizon
      el('div', { style:{ position:'absolute', left:'50%', bottom:'-6%', width:'120%', height:'46%', transform:'translateX(-50%) perspective(520px) rotateX(62deg)',
        backgroundImage:'linear-gradient(rgba(232,184,75,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(232,184,75,.10) 1px,transparent 1px)',
        backgroundSize:'11% 16%', opacity:.5, maskImage:'radial-gradient(60% 80% at 50% 0%,#000,transparent 75%)', WebkitMaskImage:'radial-gradient(60% 80% at 50% 0%,#000,transparent 75%)' } })
    );

    // real art (null while the file is absent)
    const bgImgEl = missing ? null : el('img', { key:file, src, alt:'',
      onError:() => this.setState(s => ({ missing: Object.assign({}, s.missing, { [file]:true }) })),
      style:{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover' } });

    // dust — build once, stable identity so CSS motion never resets
    if (!this._dust){
      const motes = [];
      for (let i=0;i<18;i++){
        const sz = 2 + Math.random()*3;
        motes.push(el('span', { key:i, style:{ position:'absolute', left:(Math.random()*100)+'%', top:(58+Math.random()*42)+'%',
          width:sz, height:sz, borderRadius:'50%', background:'rgba(245,215,131,'+(0.3+Math.random()*0.5).toFixed(2)+')',
          boxShadow:'0 0 6px rgba(245,215,131,.6)', animation:'lsDust '+(6+Math.random()*7).toFixed(1)+'s ease-in '+(Math.random()*6).toFixed(1)+'s infinite' } }));
      }
      this._dust = el('div', { style:{ position:'absolute', inset:0, zIndex:2, pointerEvents:'none', overflow:'hidden' } }, ...motes);
    }

    // ornate rotating crest with pulsing dama diamond
    const crestEl = el('div', { style:{ position:'relative', width:80, height:80, margin:'0 auto 22px' } },
      el('div', { style:{ position:'absolute', inset:0, borderRadius:'50%',
        background:'conic-gradient(from 0deg, rgba(245,215,131,0), rgba(245,215,131,.95), rgba(245,215,131,0) 55%)',
        animation:'lsSpin 3.4s linear infinite',
        WebkitMask:'radial-gradient(closest-side, transparent 70%, #000 72%)', mask:'radial-gradient(closest-side, transparent 70%, #000 72%)' } }),
      el('div', { style:{ position:'absolute', inset:9, borderRadius:'50%', border:'1px solid rgba(232,184,75,.4)' } }),
      el('div', { style:{ position:'absolute', inset:0, display:'flex', alignItems:'center', justifyContent:'center' } },
        el('div', { style:{ width:30, height:30, transform:'rotate(45deg)', borderRadius:7,
          background:'linear-gradient(135deg,#f7e2a0,#c99a2e)',
          boxShadow:'0 0 18px rgba(245,215,131,.55), inset 0 0 0 2px rgba(255,255,255,.35)',
          animation:'lsPulse 2.2s ease-in-out infinite' } }))
    );

    const spinnerEl = el('div', { style:{ width:20, height:20, flex:'none', borderRadius:'50%',
      background:'conic-gradient(from 0deg, rgba(245,215,131,0), #f5d783)',
      WebkitMask:'radial-gradient(closest-side, transparent 60%, #000 62%)', mask:'radial-gradient(closest-side, transparent 60%, #000 62%)',
      animation:'lsSpin .9s linear infinite' } });

    const progressBar = el('div', { style:{ position:'relative', height:9, borderRadius:100,
      background:'rgba(15,8,32,.75)', border:'1px solid rgba(232,184,75,.35)', overflow:'hidden', boxShadow:'inset 0 1px 3px rgba(0,0,0,.6)' } },
      el('div', { style:{ position:'absolute', top:0, bottom:0, left:0, width:pct+'%', borderRadius:100,
        background:'linear-gradient(90deg,#c99a2e,#f5d783 60%,#fff3cf)', boxShadow:'0 0 12px rgba(245,215,131,.6)', transition:'width .18s linear' } },
        el('div', { style:{ position:'absolute', top:0, bottom:0, width:'40%',
          background:'linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent)', animation:'lsShimmer 1.4s linear infinite' } }))
    );

    const tipEl = el('div', { key:this.state.tipIdx, style:{ animation:'lsFadeUp .5s ease-out both', font:'400 14px/1.5 Inter', color:'var(--ink)', maxWidth:540 } },
      el('span', { style:{ color:'var(--gold)', fontWeight:700, letterSpacing:'.4px' } }, 'Tip · '),
      this.tips[this.state.tipIdx]
    );

    return {
      sceneLayer, bgImgEl, dustLayer:this._dust, crestEl, spinnerEl, progressBar, tipEl,
      eyebrow: c.eyebrow,
      pctText: Math.round(pct) + '%',
      showDust: this.props.showDust !== false,
      showNote: missing,
      noteText: 'Add art → uploads/' + file,
    };
  }
}
</script>
</body>
</html>
